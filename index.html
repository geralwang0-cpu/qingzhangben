  <div class="app-shell">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark"><svg><use href="#i-logo"></use></svg></span>
        <span class="brand-name">轻账本</span>
      </div>
      <div class="top-actions">
        <button class="icon-btn" id="exportBtn" type="button" data-action="export" title="导出数据" aria-label="导出数据">
          <svg><use href="#i-download"></use></svg>
        </button>
        <button class="icon-btn" type="button" data-action="goto" data-view="settings" title="设置" aria-label="设置">
          <svg><use href="#i-user"></use></svg>
        </button>
      </div>
    </header>

    <main id="appMain">
      <section id="view-home" class="view active">
        <div class="month-strip">
          <button class="icon-btn" type="button" data-action="month-prev" title="上个月" aria-label="上个月">
            <svg><use href="#i-left"></use></svg>
          </button>
          <button class="month-title" type="button" id="monthTitle" data-action="month-picker">本月</button>
          <button class="icon-btn" type="button" data-action="month-next" title="下个月" aria-label="下个月">
            <svg><use href="#i-right"></use></svg>
          </button>
        </div>

        <section class="summary-panel" id="homeSummary"></section>

        <div class="quick-input">
          <button class="icon-btn voice-btn" id="voiceBtn" type="button" data-action="voice" title="语音记账" aria-label="语音记账" hidden>
            <svg><use href="#i-mic"></use></svg>
          </button>
          <input id="quickText" class="quick-text" type="search" autocomplete="off" enterkeyhint="send" placeholder="早餐 8.5，滴滴 23 元" aria-label="记一笔">
          <button class="send-btn" type="button" data-action="parse" title="记一笔" aria-label="记一笔">
            <svg><use href="#i-send"></use></svg>
          </button>
        </div>

        <section class="day-summary" id="homeBreakdown"></section>

        <div class="list-head">
          <h2>账单</h2>
          <div class="list-filters">
            <button class="chip" type="button" data-action="filter-type" data-value="all">全部</button>
            <button class="chip" type="button" data-action="filter-type" data-value="expense">支出</button>
            <button class="chip" type="button" data-action="filter-type" data-value="income">收入</button>
          </div>
        </div>
        <section class="record-list" id="recordList"></section>
      </section>

      <section id="view-stats" class="view">
        <div class="stats-toolbar">
          <div class="seg" id="rangeSeg">
            <button type="button" class="seg-btn active" data-action="stats-range" data-value="month">本月</button>
            <button type="button" class="seg-btn" data-action="stats-range" data-value="lastMonth">上月</button>
            <button type="button" class="seg-btn" data-action="stats-range" data-value="7d">近7天</button>
            <button type="button" class="seg-btn" data-action="stats-range" data-value="year">今年</button>
            <button type="button" class="seg-btn" data-action="stats-range" data-value="all">全部</button>
            <button type="button" class="seg-btn" data-action="stats-range" data-value="custom">自定义</button>
          </div>
          <div class="date-range" id="customRangeRow" hidden>
            <label class="date-field">
              <span>从</span>
              <input type="date" id="statFrom" data-action="stats-date" aria-label="开始日期">
            </label>
            <label class="date-field">
              <span>到</span>
              <input type="date" id="statTo" data-action="stats-date" aria-label="结束日期">
            </label>
          </div>
          <div class="filter-row">
            <label class="select-wrap">
              <svg><use href="#i-down"></use></svg>
              <select id="statType" data-action="stats-change">
                <option value="expense">支出</option>
                <option value="income">收入</option>
                <option value="all">全部</option>
              </select>
            </label>
            <label class="select-wrap">
              <svg><use href="#i-filter"></use></svg>
              <select id="statCategory" data-action="stats-change">
                <option value="">全部分类</option>
              </select>
            </label>
            <label class="select-wrap">
              <svg><use href="#i-tag"></use></svg>
              <select id="statPayment" data-action="stats-change">
                <option value="">全部支付方式</option>
              </select>
            </label>
          </div>
          <div class="dim-row">
            <label class="select-wrap dim">
              <span>维度</span>
              <select id="statDimension" data-action="stats-change"></select>
            </label>
            <label class="select-wrap dim">
              <span>指标</span>
              <select id="statMetric" data-action="stats-change"></select>
            </label>
          </div>
          <div class="seg" id="chartModeSeg">
            <button type="button" class="seg-btn active" data-action="chart-mode" data-value="dist">分布</button>
            <button type="button" class="seg-btn" data-action="chart-mode" data-value="trend">趋势</button>
            <button type="button" class="seg-btn" data-action="chart-mode" data-value="table">明细</button>
          </div>
        </div>
        <section class="stat-cards" id="statCards"></section>
        <section class="panel chart-panel" id="chartPanel"></section>
        <section class="table-wrap" id="statTable"></section>
      </section>

      <section id="view-settings" class="view">
        <div class="settings-section">
          <h2>安装到手机</h2>
          <div class="settings-actions">
            <button class="action-btn wide" type="button" data-action="install">
              <svg><use href="#i-download"></use></svg><span>安装轻账本</span>
            </button>
          </div>
        </div>

        <div class="settings-section">
          <h2>数据</h2>
          <div class="settings-actions">
            <button class="action-btn" type="button" data-action="export">
              <svg><use href="#i-download"></use></svg><span>导出</span>
            </button>
            <button class="action-btn" type="button" data-action="import">
              <svg><use href="#i-upload"></use></svg><span>导入</span>
            </button>
            <button class="action-btn danger" type="button" data-action="reset">
              <svg><use href="#i-trash"></use></svg><span>清空</span>
            </button>
          </div>
          <input type="file" id="importFile" accept="application/json,.json" hidden>
          <div class="storage-line" id="storageLine"></div>
        </div>

        <div class="settings-section">
          <h2>智能分类规则</h2>
          <form class="rule-form" id="ruleForm">
            <input type="text" id="ruleKeyword" placeholder="关键词" aria-label="关键词">
            <select id="ruleCategory" aria-label="分类"></select>
            <button class="primary small" type="submit">添加</button>
          </form>
          <ul class="rule-list" id="ruleList"></ul>
        </div>

        <div class="settings-section">
          <h2>我的分类</h2>
          <div class="settings-actions">
            <button class="action-btn wide" type="button" data-action="use-my-categories">
              <svg><use href="#i-refresh"></use></svg><span>使用我的 13 个分类</span>
            </button>
            <button class="action-btn" type="button" data-action="add-category">
              <svg><use href="#i-plus"></use></svg><span>新增分类</span>
            </button>
          </div>
          <ul class="category-list" id="categoryList"></ul>
        </div>

        <div class="settings-section">
          <h2>关于</h2>
          <div class="about-box">
            <p>轻账本 v1.8</p>
            <p>本地账本</p>
          </div>
        </div>
      </section>
    </main>

    <nav class="bottom-nav">
      <button class="nav-btn active" type="button" data-action="goto" data-view="home">
        <svg><use href="#i-home"></use></svg><span>首页</span>
      </button>
      <button class="nav-btn center" type="button" data-action="add" aria-label="记一笔">
        <span class="nav-plus"><svg><use href="#i-plus"></use></svg></span>
      </button>
      <button class="nav-btn" type="button" data-action="goto" data-view="stats">
        <svg><use href="#i-chart"></use></svg><span>统计</span>
      </button>
    </nav>
  </div>

  <div class="modal" id="recordModal" hidden>
    <div class="modal-backdrop" data-action="close-modal"></div>
    <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="recordModalTitle">
      <header class="sheet-head">
        <h2 id="recordModalTitle">记一笔</h2>
        <button class="icon-btn" type="button" data-action="close-modal" title="关闭" aria-label="关闭">
          <svg><use href="#i-close"></use></svg>
        </button>
      </header>
      <form id="recordForm">
        <div class="type-seg" id="recordTypeSeg">
          <button class="type-btn expense active" type="button" data-action="record-type" data-value="expense">
            <svg><use href="#i-up"></use></svg>支出
          </button>
          <button class="type-btn income" type="button" data-action="record-type" data-value="income">
            <svg><use href="#i-down"></use></svg>收入
          </button>
        </div>
        <label class="field">
          <span>金额</span>
          <input id="fAmount" type="number" min="0" step="0.01" inputmode="decimal" placeholder="0.00" required>
        </label>
        <label class="field">
          <span>商品 / 事项</span>
          <input id="fItem" type="text" placeholder="午餐" required>
        </label>
        <label class="field">
          <span>商户</span>
          <input id="fMerchant" type="text" placeholder="麦当劳">
        </label>
        <div class="field">
          <span>分类</span>
          <div class="category-picker" id="categoryPicker"></div>
        </div>
        <div class="form-grid">
          <label class="field">
            <span>日期</span>
            <input id="fDate" type="date" required>
          </label>
          <label class="field">
            <span>时间</span>
            <input id="fTime" type="time" required>
          </label>
        </div>
        <div class="form-grid">
          <label class="field">
            <span>支付方式</span>
            <select id="fPayment">
              <option value="">未填写</option>
            </select>
          </label>
          <label class="field">
            <span>标签</span>
            <input id="fTags" type="text" placeholder="咖啡, 通勤">
          </label>
        </div>
        <label class="field">
          <span>备注</span>
          <textarea id="fNote" rows="2" placeholder="可选"></textarea>
        </label>
        <button class="primary save-btn" type="submit">保存</button>
      </form>
    </div>
  </div>

  <div class="modal" id="categoryModal" hidden>
    <div class="modal-backdrop" data-action="close-category-modal"></div>
    <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="categoryModalTitle">
      <header class="sheet-head">
        <h2 id="categoryModalTitle">编辑分类</h2>
        <button class="icon-btn" type="button" data-action="close-category-modal" title="关闭" aria-label="关闭">
          <svg><use href="#i-close"></use></svg>
        </button>
      </header>
      <form id="categoryForm">
        <label class="field">
          <span>分类名称</span>
          <input id="catName" type="text" placeholder="买菜" required>
        </label>
        <label class="field">
          <span>类型</span>
          <select id="catType">
            <option value="expense">支出</option>
            <option value="income">收入</option>
          </select>
        </label>
        <label class="field">
          <span>自动识别关键词</span>
          <input id="catAliases" type="text" placeholder="菜市场, 蔬菜, 鸡蛋">
        </label>
        <button class="primary save-btn" type="submit">保存分类</button>
      </form>
    </div>
  </div>

  <div class="modal" id="dialogModal" hidden>
    <div class="modal-backdrop"></div>
    <div class="dialog" role="alertdialog" aria-modal="true" aria-labelledby="dialogTitle">
      <h2 id="dialogTitle"></h2>
      <p id="dialogBody"></p>
      <input id="dialogInput" type="text" hidden>
      <div class="dialog-actions">
        <button class="secondary" type="button" id="dialogCancel">取消</button>
        <button class="danger" type="button" id="dialogOk">确定</button>
      </div>
    </div>
  </div>

  <div class="toast-root" id="toastRoot" aria-live="polite"></div>
  <script src="app.js?v=19"></script>
</body>
</html>
